services:
  db:
    image: postgis/postgis:18-3.6
    container_name: sae-cdmx-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sae_cdmx}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sae_cdmx}"]
      interval: 5s
      timeout: 5s
      retries: 20

  denue-updater:
    build:
      context: ./etl
    container_name: sae-cdmx-denue-updater
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ETL_DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-sae_cdmx}
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: sae-cdmx-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    container_name: sae-cdmx-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8081:80"

volumes:
  postgres_data:
